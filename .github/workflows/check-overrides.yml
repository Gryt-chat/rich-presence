name: Check overrides

on:
  pull_request:
    paths:
      - "overrides.json"
      - "scripts/validate-overrides.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-overrides.mjs
